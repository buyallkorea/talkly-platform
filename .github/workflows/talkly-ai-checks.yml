name: TALKLY AI safety checks
on:
  pull_request:
    paths:
      - "app/talkly-ai/**"
      - "app/api/talkly-ai/**"
      - "lib/talkly-ai/**"
      - "lib/supabase-admin.ts"
      - "lib/email.ts"
      - "lib/solapi.ts"
      - "app/api/auth/signup/route.ts"
      - "app/admin/talkly-ai/**"
      - "tests/*.test.cjs"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tests/talkly-ai/**"
      - "supabase/migrations/**"
      - ".github/workflows/talkly-ai-checks.yml"
  push:
    branches: [feat/talkly-ai-integration]
    paths:
      - "app/talkly-ai/**"
      - "app/api/talkly-ai/**"
      - "lib/talkly-ai/**"
      - "lib/supabase-admin.ts"
      - "lib/email.ts"
      - "lib/solapi.ts"
      - "app/api/auth/signup/route.ts"
      - "app/admin/talkly-ai/**"
      - "tests/*.test.cjs"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tests/talkly-ai/**"
      - "supabase/migrations/**"
      - ".github/workflows/talkly-ai-checks.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run test:talkly-ai
      - run: npm run test:regression
